<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Puesto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header>
    <nav class="navbar topbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center text-decoration-none" th:href="@{/empresa/dashboard}">
                <img th:src="@{/img/logo.png}" alt="Logo" class="site-logo">
                <span class="brand-text">Panel Empresa</span>
            </a>
            <div class="nav-links-custom">
                <a class="nav-link" th:href="@{/empresa/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/empresa/mis-puestos}">Mis puestos</a>
                <a class="nav-link" th:href="@{/empresa/nuevo-puesto}">Nuevo puesto</a>
                <a class="nav-link" th:href="@{/empresa/candidatos}">Candidatos</a>
            </div>
        </div>
    </nav>
</header>

<main class="main-content">
    <section class="container page-section">
        <div class="form-card max-w-900">
            <h1 class="form-title">Nuevo puesto</h1>
            <form class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nombre del puesto</label>
                    <input type="text" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Salario</label>
                    <input type="number" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Modalidad</label>
                    <select class="form-select">
                        <option>Presencial</option>
                        <option>Remoto</option>
                        <option>Híbrido</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Estado</label>
                    <select class="form-select">
                        <option>Activo</option>
                        <option>Inactivo</option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Descripción</label>
                    <textarea class="form-control" rows="4"></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">Requisitos</label>
                    <textarea class="form-control" rows="4"></textarea>
                </div>
                <div class="col-12 form-actions">
                    <button type="submit" class="btn btn-primary">Guardar</button>
                    <a th:href="@{/empresa/mis-puestos}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </section>
</main>

<footer class="footer-custom">
    <div class="container d-flex justify-content-between">
        <div class="footer-left">
            <strong>Bolsa de Empleo</strong><br>
            Módulo Empresa
        </div>
        <div class="footer-right text-end">
            Contacto: empresa@bolsaempleo.local<br>
            Créditos: Equipo de desarrollo
        </div>
    </div>
</footer>
</body>
</html>
