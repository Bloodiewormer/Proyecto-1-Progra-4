<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Registro Oferente')}"></head>
<body>

<header>
    <nav th:replace="~{fragments/layout :: navbar-public}"></nav>
</header>

<main class="main-content">
    <section class="container page-section">
        <div class="register-wrapper">
            <div class="form-card">
                <h1 class="form-title">Registro de Oferente</h1>

                <div th:if="${success}" class="alert alert-success">
                    ¡Oferente registrado correctamente! Espera aprobación del administrador.
                </div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form class="row g-3" th:action="@{/registro/oferente}" th:object="${oferenteDto}" method="post">
                    <div class="col-md-6">
                        <label class="form-label">Nombre</label>
                        <input type="text" class="form-control" th:field="*{nombre}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Apellido</label>
                        <input type="text" class="form-control" th:field="*{apellido}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Identificación</label>
                        <input type="text" class="form-control" th:field="*{identificacion}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nacionalidad</label>
                        <input type="text" class="form-control" th:field="*{nacionalidad}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Teléfono</label>
                        <input type="text" class="form-control" th:field="*{telefono}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Correo</label>
                        <input type="email" class="form-control" th:field="*{correo}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Residencia</label>
                        <input type="text" class="form-control" th:field="*{residencia}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" th:field="*{password}" required>
                    </div>
                    <div class="col-12 form-actions">
                        <button type="submit" class="btn btn-primary">Registrar Oferente</button>
                        <a th:href="@{/}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer('Total Soft Inc.', 'info@bolsaempleo.local')}"></footer>

</body>
</html>
