<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Empresas Pendientes')}"></head>
<body>

<header>
    <nav th:replace="~{fragments/layout :: navbar-admin}"></nav>
</header>

<main class="main-content">
    <section class="container page-section">
        <h1 class="page-title">Empresas pendientes</h1>
        <p class="page-subtitle">Solicitudes pendientes de aprobación</p>

        <div class="table-card">
            <table class="table table-bordered align-middle">
                <thead>
                <tr>
                    <th>Empresa</th>
                    <th>Correo</th>
                    <th>Teléfono</th>
                    <th>Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(empresas)}">
                    <td colspan="4" class="text-center text-muted">No hay empresas pendientes.</td>
                </tr>
                <tr th:each="empresa : ${empresas}">
                    <td th:text="${empresa.nombre}"></td>
                    <td th:text="${empresa.usuario.correo}"></td>
                    <td th:text="${empresa.telefono}"></td>
                    <td>
                        <form th:action="@{/admin/usuarios/{id}/aprobar(id=${empresa.usuario.id})}"
                              method="post" style="display:inline;">
                            <input type="hidden" name="origen" value="empresa">
                            <button type="submit" class="btn btn-sm btn-primary">Aprobar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer('Módulo Administración', 'admin@bolsaempleo.local')}"></footer>

</body>
</html>
