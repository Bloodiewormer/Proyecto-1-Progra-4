<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Características</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header>
    <nav class="navbar topbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center text-decoration-none" th:href="@{/admin/dashboard}">
                <img th:src="@{/img/logo.png}" alt="Logo" class="site-logo">
                <span class="brand-text">Panel Admin</span>
            </a>
            <div class="nav-links-custom">
                <a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/admin/empresas-pendientes}">Empresas</a>
                <a class="nav-link" th:href="@{/admin/oferentes-pendientes}">Oferentes</a>
                <a class="nav-link" th:href="@{/admin/caracteristicas}">Características</a>
                <a class="nav-link" th:href="@{/admin/reporte}">Reporte</a>
            </div>
        </div>
    </nav>
</header>

<main class="main-content">
    <section class="container page-section">
        <h1 class="page-title">Características</h1>
        <p class="page-subtitle">Gestione habilidades y criterios del sistema</p>

        <div class="panel-card mb-4">
            <form class="row g-3">
                <div class="col-md-8">
                    <label class="form-label">Nueva característica</label>
                    <input type="text" class="form-control">
                </div>
                <div class="col-md-4 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">Agregar</button>
                </div>
            </form>
        </div>

        <div class="table-card">
            <table class="table table-bordered align-middle">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Estado</th>
                    <th>Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td>Trabajo en equipo</td>
                    <td>Activo</td>
                    <td><button class="btn btn-sm btn-outline-danger">Eliminar</button></td>
                </tr>
                <tr>
                    <td>Java</td>
                    <td>Activo</td>
                    <td><button class="btn btn-sm btn-outline-danger">Eliminar</button></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer class="footer-custom">
    <div class="container d-flex justify-content-between">
        <div class="footer-left">
            <strong>Bolsa de Empleo</strong><br>
            Módulo Administración
        </div>
        <div class="footer-right text-end">
            Contacto: admin@bolsaempleo.local<br>
            Créditos: Equipo de desarrollo
        </div>
    </div>
</footer>
</body>
</html>
