<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscar Puestos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header>
    <nav class="navbar topbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center text-decoration-none" th:href="@{/}">
                <img th:src="@{/img/logo.png}" alt="Logo" class="site-logo">
                <span class="brand-text">BolsaEmpleo</span>
            </a>
            <div class="nav-links-custom">
                <a class="nav-link" th:href="@{/buscar}">Buscar puestos</a>
                <a class="nav-link" th:href="@{/registro/empresa}">Registro Empresa</a>
                <a class="nav-link" th:href="@{/registro/oferente}">Registro Oferente</a>
                <a class="nav-link" th:href="@{/login}">Login</a>
            </div>
        </div>
    </nav>
</header>

<main class="main-content">
    <section class="container page-section">
        <h1 class="page-title">Buscar puestos</h1>
        <p class="page-subtitle">Filtre por nombre, empresa o salario</p>

        <div class="form-card mb-4">
            <form class="row g-3" th:action="@{/buscar}" th:object="${filtro}" method="post">
                <div class="col-md-4">
                    <label class="form-label">Palabra clave (puesto o empresa)</label>
                    <input type="text" class="form-control" th:field="*{palabraClave}" placeholder="Nombre del puesto">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Salario mínimo</label>
                    <input type="number" class="form-control" th:field="*{salarioMin}" placeholder="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Salario máximo</label>
                    <input type="number" class="form-control" th:field="*{salarioMax}" placeholder="0">
                </div>
                <div class="col-12 form-actions">
                    <button type="submit" class="btn btn-primary">Buscar</button>
                    <a th:href="@{/buscar}" class="btn btn-outline-secondary">Limpiar</a>
                </div>
            </form>
        </div>

        <!-- Resultados -->
        <div class="row g-4" th:if="${resultados != null}">
            <div th:each="puesto : ${resultados}" class="col-md-6">
                <div class="job-card">
                    <div class="job-company" th:text="${puesto.empresa.nombre}"></div>
                    <div class="job-title" th:text="${puesto.titulo}"></div>
                    <div class="job-salary" th:text="${#numbers.formatDecimal(puesto.salario, 1, 'COMMA', 2, 'POINT')}"></div>
                    <a th:href="@{/buscar}" class="btn btn-outline-primary btn-job">Ver detalle</a>
                </div>
            </div>
        </div>

        <div th:if="${resultados != null and #lists.isEmpty(resultados)}" class="alert alert-info">
            No se encontraron puestos con los filtros aplicados.
        </div>
    </section>
</main>

<footer class="footer-custom">
    <div class="container d-flex justify-content-between">
        <div class="footer-left">
            <strong>Bolsa de Empleo</strong><br>
            Total Soft Inc.
        </div>
        <div class="footer-right text-end">
            Contacto: info@bolsaempleo.local<br>
            Créditos: Equipo de desarrollo
        </div>
    </div>
</footer>
</body>
</html>
