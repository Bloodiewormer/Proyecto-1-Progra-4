<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bolsa de Empleo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header>
    <nav class="navbar topbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center text-decoration-none" th:href="@{/}">
                <img th:src="@{/img/logo.png}" alt="Logo" class="site-logo">
                <span class="brand-text">BolsaEmpleo</span>
            </a>
            <div class="nav-links-custom">
                <a class="nav-link" th:href="@{/buscar}">Buscar puestos</a>
                <a class="nav-link" th:href="@{/registro/empresa}">Registro Empresa</a>
                <a class="nav-link" th:href="@{/registro/oferente}">Registro Oferente</a>
                <a class="nav-link" th:href="@{/login}">Login</a>
            </div>
        </div>
    </nav>
</header>

<main class="main-content">
    <section class="container page-section">
        <h1 class="page-title">Bolsa de Empleo</h1>
        <p class="page-subtitle">Últimos 5 puestos públicos</p>

        <div class="row g-4">
            <div th:each="puesto : ${puestosRecientes}" class="col-md-6 col-lg-4">
                <div class="job-card">
                    <div class="job-company" th:text="${puesto.empresa.nombre}"></div>
                    <div class="job-title" th:text="${puesto.titulo}"></div>
                    <div class="job-salary" th:text="${#numbers.formatDecimal(puesto.salario, 1, 'COMMA', 2, 'POINT')}"></div>

                    <a th:href="@{/buscar}" class="btn btn-outline-primary btn-job">Ver detalle</a>

                    <!-- Hover detalle (como en la imagen del profesor) -->
                    <div class="job-detail-box">
                        <h6 th:text="${puesto.titulo}"></h6>
                        <ul>
                            <li th:each="pc : ${puesto.puestoCaracteristicas}"
                                th:text="${pc.caracteristica.nombre} + ' (nivel ' + ${pc.nivelRequerido} + ')'"></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>

<footer class="footer-custom">
    <div class="container d-flex justify-content-between">
        <div class="footer-left">
            <strong>Bolsa de Empleo</strong><br>
            Total Soft Inc.
        </div>
        <div class="footer-right text-end">
            Contacto: info@bolsaempleo.local<br>
            Créditos: Equipo de desarrollo
        </div>
    </div>
</footer>
</body>
</html>
