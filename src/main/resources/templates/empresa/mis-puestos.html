<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mis Puestos')}"></head>
<body>

<header>
    <nav th:replace="~{fragments/layout :: navbar-empresa}"></nav>
</header>

<main class="main-content">
    <section class="container page-section">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="page-title">Mis puestos</h1>
                <p class="page-subtitle">Gestione las vacantes publicadas</p>
            </div>
            <a th:href="@{/empresa/nuevo-puesto}" class="btn btn-primary">Nuevo puesto</a>
        </div>

        <div class="table-card">
            <table class="table table-bordered align-middle">
                <thead>
                <tr>
                    <th>Puesto</th>
                    <th>Salario</th>
                    <th>Tipo</th>
                    <th>Estado</th>
                    <th>Características</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(puestos)}">
                    <td colspan="6" class="text-center text-muted">No hay puestos registrados aún.</td>
                </tr>
                <tr th:each="puesto : ${puestos}">
                    <td th:text="${puesto.titulo}"></td>
                    <td th:text="${#numbers.formatDecimal(puesto.salario, 1, 'COMMA', 2, 'POINT')}"></td>
                    <td>
                        <span class="badge"
                              th:classappend="${puesto.tipoPublicacion == 'PUBLICO'} ? 'bg-success' : 'bg-secondary'"
                              th:text="${puesto.tipoPublicacion}"></span>
                    </td>
                    <td>
                        <span class="badge"
                              th:classappend="${puesto.estado == 'ACTIVO'} ? 'bg-success' : 'bg-secondary'"
                              th:text="${puesto.estado}"></span>
                    </td>
                    <td>
                        <span th:each="pc : ${puesto.puestoCaracteristicas}" class="badge bg-info me-1"
                              th:text="${pc.caracteristica.nombre} + ' (nivel ' + ${pc.nivelRequerido} + ')'"></span>
                        <span th:if="${#lists.isEmpty(puesto.puestoCaracteristicas)}"
                              class="text-muted">Sin características</span>
                    </td>
                    <td>
                        <a th:href="@{/empresa/candidatos(idPuesto=${puesto.id})}"
                           class="btn btn-sm btn-outline-primary">Ver candidatos</a>
                        <form th:action="@{/empresa/puestos/{idPuesto}/desactivar(idPuesto=${puesto.id})}"
                              method="post" style="display: inline;">
                            <button type="submit" class="btn btn-sm btn-outline-danger"
                                    onclick="return confirm('¿Desactivar este puesto?');">
                                Desactivar
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer('Módulo Empresa', 'empresa@bolsaempleo.local')}"></footer>

</body>
</html>
