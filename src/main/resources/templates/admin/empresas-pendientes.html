<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Empresas Pendientes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header>
    <nav class="navbar topbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center text-decoration-none" th:href="@{/admin/dashboard}">
                <img th:src="@{/img/logo.png}" alt="Logo" class="site-logo">
                <span class="brand-text">Panel Admin</span>
            </a>
            <div class="nav-links-custom">
                <a class="nav-link" th:href="@{/admin/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/admin/empresas-pendientes}">Empresas</a>
                <a class="nav-link" th:href="@{/admin/oferentes-pendientes}">Oferentes</a>
                <a class="nav-link" th:href="@{/admin/caracteristicas}">Características</a>
                <a class="nav-link" th:href="@{/admin/reporte}">Reporte</a>
            </div>
        </div>
    </nav>
</header>

<main class="main-content">
    <section class="container page-section">
        <h1 class="page-title">Empresas pendientes</h1>
        <p class="page-subtitle">Solicitudes pendientes de aprobación</p>

        <div class="table-card">
            <table class="table table-bordered align-middle">
                <thead>
                <tr>
                    <th>Empresa</th>
                    <th>Correo</th>
                    <th>Teléfono</th>
                    <th>Acción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(empresas)}">
                    <td colspan="4" class="text-center text-muted">No hay empresas pendientes.</td>
                </tr>
                <tr th:each="empresa : ${empresas}">
                    <td th:text="${empresa.nombre}"></td>
                    <td th:text="${empresa.correo}"></td>
                    <td th:text="${empresa.telefono}"></td>
                    <td>
                        <form th:action="@{/admin/usuarios/{id}/aprobar(id=${empresa.id})}" method="post" style="display:inline;">
                            <button type="submit" class="btn btn-sm btn-primary">Aprobar</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>

<footer class="footer-custom">
    <div class="container d-flex justify-content-between">
        <div class="footer-left">
            <strong>Bolsa de Empleo</strong><br>
            Módulo Administración
        </div>
        <div class="footer-right text-end">
            Contacto: admin@bolsaempleo.local<br>
            Créditos: Equipo de desarrollo
        </div>
    </div>
</footer>
</body>
</html>
