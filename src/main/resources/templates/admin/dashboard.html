<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Dashboard Admin')}"></head>
<body>

<header>
    <nav th:replace="~{fragments/layout :: navbar-admin}"></nav>
</header>

<main class="main-content">
    <section class="container page-section">
        <h1 class="page-title">Dashboard Administrador</h1>
        <p class="page-subtitle">Panel principal de administración</p>

        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="stats-card">
                    <div class="stats-number" th:text="${empresasPendientes}">0</div>
                    <div class="stats-label">Empresas pendientes</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <div class="stats-number" th:text="${oferentesPendientes}">0</div>
                    <div class="stats-label">Oferentes pendientes</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <div class="stats-number" th:text="${totalCaracteristicas}">0</div>
                    <div class="stats-label">Características</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stats-card">
                    <div class="stats-number" th:text="${totalPuestos}">0</div>
                    <div class="stats-label">Puestos registrados</div>
                </div>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-title">Acciones rápidas</div>
            <div class="panel-actions">
                <a th:href="@{/admin/empresas-pendientes}" class="btn btn-primary">Ver empresas pendientes</a>
                <a th:href="@{/admin/oferentes-pendientes}" class="btn btn-outline-primary">Ver oferentes pendientes</a>
                <a th:href="@{/admin/caracteristicas}" class="btn btn-outline-secondary">Gestionar características</a>
                <a th:href="@{/admin/reporte}" class="btn btn-outline-secondary">Ver reporte</a>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer('Módulo Administración', 'admin@bolsaempleo.local')}"></footer>

</body>
</html>
