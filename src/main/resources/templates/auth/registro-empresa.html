<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Empresa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header>
    <nav class="navbar topbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center text-decoration-none" th:href="@{/}">
                <img th:src="@{/img/logo.png}" alt="Logo" class="site-logo">
                <span class="brand-text">BolsaEmpleo</span>
            </a>
        </div>
    </nav>
</header>

<main class="main-content">
    <section class="container page-section">
        <div class="register-wrapper">
            <div class="form-card">
                <h1 class="form-title">Registro de Empresa</h1>

                <div th:if="${success}" class="alert alert-success">¡Empresa registrada correctamente! Espera aprobación del administrador.</div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>


                <form class="row g-3" th:action="@{/registro/empresa}" th:object="${empresaDto}" method="post">
                    <div class="col-md-6">
                        <label class="form-label">Nombre de la empresa</label>
                        <input type="text" class="form-control" th:field="*{nombre}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Cédula jurídica</label>
                        <input type="text" class="form-control" th:field="*{identificacion}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Correo</label>
                        <input type="email" class="form-control" th:field="*{correo}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Teléfono</label>
                        <input type="text" class="form-control" th:field="*{telefono}" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Dirección / Localización</label>
                        <input type="text" class="form-control" th:field="*{localizacion}" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Descripción</label>
                        <textarea class="form-control" rows="3" th:field="*{descripcion}" required></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" th:field="*{password}" required>
                    </div>
                    <div class="col-12 form-actions">
                        <button type="submit" class="btn btn-primary">Registrar Empresa</button>
                        <a th:href="@{/}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </section>
</main>

<footer class="footer-custom">
    <div class="container d-flex justify-content-between">
        <div class="footer-left">
            <strong>Bolsa de Empleo</strong><br>
            Total Soft Inc.
        </div>
        <div class="footer-right text-end">
            Contacto: info@bolsaempleo.local<br>
            Créditos: Equipo de desarrollo
        </div>
    </div>
</footer>
</body>
</html>
