<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header>
    <nav class="navbar topbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center text-decoration-none" th:href="@{/}">
                <img th:src="@{/img/logo.png}" alt="Logo" class="site-logo">
                <span class="brand-text">BolsaEmpleo</span>
            </a>
        </div>
    </nav>
</header>

<main class="main-content">
    <section class="container page-section">
        <div class="login-wrapper">
            <div class="form-card">
                <h1 class="form-title">Iniciar sesión</h1>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" placeholder="correo@ejemplo.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" class="form-control" placeholder="********">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Ingresar</button>
                        <a th:href="@{/}" class="btn btn-outline-secondary">Volver</a>
                    </div>
                </form>
            </div>
        </div>
    </section>
</main>

<footer class="footer-custom">
    <div class="container d-flex justify-content-between">
        <div class="footer-left">
            <strong>Bolsa de Empleo</strong><br>
            Total Soft Inc.
        </div>
        <div class="footer-right text-end">
            Contacto: info@bolsaempleo.local<br>
            Créditos: Equipo de desarrollo
        </div>
    </div>
</footer>
</body>
</html>
