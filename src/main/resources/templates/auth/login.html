<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header>
    <nav class="navbar topbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center text-decoration-none" th:href="@{/}">
                <img th:src="@{/img/logo.png}" alt="Logo" class="site-logo">
                <span class="brand-text">BolsaEmpleo</span>
            </a>
        </div>
    </nav>
</header>

<main class="main-content">
    <section class="container page-section">
        <div class="login-wrapper">
            <div class="form-card">
                <h1 class="form-title">Iniciar sesión</h1>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label" for="credencial">Correo o identificación</label>
                        <input id="credencial" type="text" class="form-control" placeholder="correo@ejemplo.com o ADMIN-DEMO-001" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" for="clave">Contraseña</label>
                        <input id="clave" type="password" class="form-control" placeholder="********" required>
                    </div>
                    <div id="loginError" class="alert alert-danger d-none" role="alert"></div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Ingresar</button>
                        <a th:href="@{/}" class="btn btn-outline-secondary">Volver</a>
                    </div>
                </form>
            </div>
        </div>
    </section>
</main>

<footer class="footer-custom">
    <div class="container d-flex justify-content-between">
        <div class="footer-left">
            <strong>Bolsa de Empleo</strong><br>
            Total Soft Inc.
        </div>
        <div class="footer-right text-end">
            Contacto: info@bolsaempleo.local<br>
            Créditos: Equipo de desarrollo
        </div>
    </div>
</footer>
<script>
    document.getElementById("loginForm").addEventListener("submit", async function (event) {
        event.preventDefault();

        const credencial = document.getElementById("credencial").value.trim();
        const clave = document.getElementById("clave").value;
        const errorBox = document.getElementById("loginError");
        errorBox.classList.add("d-none");
        errorBox.textContent = "";

        try {
            const response = await fetch("/api/auth/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ credencial: credencial, clave: clave })
            });

            if (!response.ok) {
                errorBox.textContent = "Credenciales inválidas o usuario sin permiso.";
                errorBox.classList.remove("d-none");
                return;
            }

            const data = await response.json();
            const rol = (data.rol || "").toUpperCase();

            if (rol === "ADMIN") {
                window.location.href = "/admin/dashboard";
                return;
            }
            if (rol === "EMPRESA") {
                window.location.href = "/empresa/dashboard";
                return;
            }
            if (rol === "OFERENTE") {
                window.location.href = "/oferente/dashboard";
                return;
            }

            errorBox.textContent = "Rol no reconocido para redirección.";
            errorBox.classList.remove("d-none");
        } catch (error) {
            errorBox.textContent = error.message;
            errorBox.classList.remove("d-none");
        }
    });
</script>
</body>
</html>
