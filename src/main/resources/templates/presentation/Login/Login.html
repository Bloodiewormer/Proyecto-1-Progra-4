<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<h1>Login</h1>
<form id="login-form">
    <label for="credencial">Credencial</label>
    <input id="credencial" name="credencial" type="text" required>

    <label for="clave">Clave</label>
    <input id="clave" name="clave" type="password" required>

    <button type="submit">Ingresar</button>
</form>
</body>
</html>
