<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Oferente</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header>
    <nav class="navbar topbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center text-decoration-none" th:href="@{/oferente/dashboard}">
                <img th:src="@{/img/logo.png}" alt="Logo" class="site-logo">
                <span class="brand-text">Panel Oferente</span>
            </a>
            <div class="nav-links-custom">
                <a class="nav-link" th:href="@{/oferente/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/oferente/habilidades}">Habilidades</a>
                <a class="nav-link" th:href="@{/oferente/subir-cv}">Subir CV</a>
            </div>
        </div>
    </nav>
</header>

<main class="main-content">
    <section class="container page-section">
        <h1 class="page-title">Dashboard Oferente</h1>
        <p class="page-subtitle">Resumen de su perfil y postulaciones</p>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="stats-card">
                    <div class="stats-number">4</div>
                    <div class="stats-label">Postulaciones realizadas</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stats-card">
                    <div class="stats-number">6</div>
                    <div class="stats-label">Habilidades registradas</div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="stats-card">
                    <div class="stats-number">1</div>
                    <div class="stats-label">CV cargado</div>
                </div>
            </div>
        </div>
    </section>
</main>

<footer class="footer-custom">
    <div class="container d-flex justify-content-between">
        <div class="footer-left">
            <strong>Bolsa de Empleo</strong><br>
            Módulo Oferente
        </div>
        <div class="footer-right text-end">
            Contacto: oferente@bolsaempleo.local<br>
            Créditos: Equipo de desarrollo
        </div>
    </div>
</footer>
</body>
</html>
