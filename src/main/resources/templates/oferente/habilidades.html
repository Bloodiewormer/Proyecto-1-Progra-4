<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis habilidades</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body>
<header>
    <nav class="navbar topbar-custom">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand d-flex align-items-center text-decoration-none" th:href="@{/oferente/dashboard}">
                <span class="brand-text">Panel Oferente</span>
            </a>
            <div class="nav-links-custom">
                <a class="nav-link" th:href="@{/oferente/dashboard}">Dashboard</a>
                <a class="nav-link" th:href="@{/oferente/habilidades}">Habilidades</a>
                <a class="nav-link" th:href="@{/oferente/subir-cv}">Subir CV</a>
            </div>
        </div>
    </nav>
</header>

<main class="main-content">
    <section class="container page-section">
        <h1 class="page-title">Mis habilidades</h1>
        <p class="page-subtitle">Agregue y administre sus conocimientos (máximo 5)</p>

        <!-- POST a endpoint SSR, no a /api/ -->
        <form th:action="@{/oferente/habilidades}" method="post">
            <div class="panel-card mb-4">
                <table class="table table-bordered">
                    <thead>
                    <tr>
                        <th>Característica</th>
                        <th>Nivel (1-5)</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="hab, stat : ${habilidades}">
                        <td>
                            <select class="form-select" name="idCaracteristica">
                                <option value="">-- Seleccione --</option>
                                <option th:each="car : ${caracteristicas}"
                                        th:value="${car.id}"
                                        th:text="${car.nombre}"
                                        th:selected="${hab.idCaracteristica != null and hab.idCaracteristica == car.id}">
                                </option>
                            </select>
                        </td>
                        <td>
                            <input type="number" class="form-control" name="nivel"
                                   min="1" max="5" th:value="${hab.nivel}">
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Guardar habilidades</button>
                <a th:href="@{/oferente/dashboard}" class="btn btn-outline-secondary">Cancelar</a>
            </div>
        </form>
    </section>
</main>

<footer class="footer-custom">
    <div class="container d-flex justify-content-between">
        <div class="footer-left"><strong>Bolsa de Empleo</strong><br>Módulo Oferente</div>
        <div class="footer-right text-end">Contacto: oferente@bolsaempleo.local<br>Créditos: Equipo de desarrollo</div>
    </div>
</footer>
</body>
</html>
