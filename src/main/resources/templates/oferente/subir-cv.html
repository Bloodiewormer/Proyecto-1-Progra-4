<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Subir CV')}"></head>
<body>

<header>
    <nav th:replace="~{fragments/layout :: navbar-oferente}"></nav>
</header>

<main class="main-content">
    <section class="container page-section">
        <div class="form-card max-w-700">
            <h1 class="form-title">Subir CV</h1>

            <form th:action="@{/oferente/subir-cv}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label">Seleccione el archivo PDF</label>
                    <input type="file" name="cv" class="form-control" accept="application/pdf" required>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Subir CV</button>
                </div>
            </form>

            <div th:if="${cvPath != null}" class="mt-4 alert alert-success">
                <strong>CV actual:</strong><br>
                <a th:href="${cvPath}" target="_blank" class="btn btn-sm btn-outline-success">Ver mi CV (PDF)</a>
            </div>
        </div>
    </section>
</main>

<footer th:replace="~{fragments/layout :: footer('Módulo Oferente', 'oferente@bolsaempleo.local')}"></footer>

</body>
</html>
